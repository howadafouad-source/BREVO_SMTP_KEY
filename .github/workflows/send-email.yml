name: Send Email

on:
  schedule:
    - cron: '0 7 * * *'   # 9:00 صباحاً بتوقيت ليبيا (7:00 UTC)
  workflow_dispatch:       # زر تشغيل يدوي للتجربة من تبويب Actions

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send Email via Brevo API
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          curl --fail-with-body -sS -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: $BREVO_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": {"name": "HAWAA", "email": "howadafouad@gmail.com"},
              "to": [{"email": "howadafouad@gmail.com"}],
              "subject": "Automated Email",
              "textContent": "This is an automated email from GitHub Actions!"
            }'
